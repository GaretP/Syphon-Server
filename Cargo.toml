[package]
name = "syphon"
version = "0.1.0"
edition = "2021"
description = "Mesh media server: encrypted library, request-based sync between trusted nodes, Tor onion services"
license = "AGPL-3.0-only"

[lib]
name = "syphon"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "syphon"
path = "src/main.rs"

[dependencies]
aho-corasick = "=1.1.5"
anyhow = "=1.0.104"
argon2 = "=0.5.3"
async-trait = "=0.1.92"
axum = { version = "=0.7.9", features = ["macros"] }
base64 = "=0.22.1"
blake3 = "=1.8.7"
bytes = "=1.12.1"
chacha20poly1305 = "=0.10.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
data-encoding = "=2.11.1"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
fs2 = "=0.4.3"
futures-util = "=0.3.34"
hex = "=0.4.3"
hmac = "=0.12.1"
if-addrs = "=0.13.4"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rand = "=0.8.8"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "socks", "rustls-tls"] }
rpassword = "=7.5.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha1 = "=0.10.7"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
toml = "=0.8.23"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.9.1"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
